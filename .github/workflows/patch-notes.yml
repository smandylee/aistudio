# 감시 중인 저장소(patch-notes/repos.json)에 새 커밋이 있으면 패치노트를 디스코드에 올린다.
# 필요한 저장소 비밀값: PATCH_NOTES_WEBHOOK_SHIRO, PATCH_NOTES_WEBHOOK_SAFEHOUSE (저장소별 패치노트 채널 웹후크),
# GCP_SA_KEY (서비스 계정 키 JSON 전체),
# PATCH_NOTES_GH_TOKEN (비공개 저장소를 읽는 읽기 전용 토큰. 없으면 공개 저장소만 읽힌다)
name: patch-notes

on:
  schedule:
    - cron: "*/10 * * * *" # GitHub 사정에 따라 몇 분씩 늦게 돌기도 한다
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patch-notes
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 비밀값을 넣기 전에는 아무것도 안 하고 성공으로 끝난다 (10분마다 실패 메일이 오지 않게).
      READY: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - if: env.READY != 'true'
        run: echo "::notice::GCP_SA_KEY 비밀값이 없어서 건너뜀"

      - if: env.READY == 'true'
        uses: actions/checkout@v4

      - if: env.READY == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: env.READY == 'true'
        run: npm ci

      - if: env.READY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 어디까지 올렸는지(저장소별 마지막 커밋)는 캐시로 이어 간다. 캐시가 사라지면 다시 북마크만 하고 시작한다.
      - if: env.READY == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/patch-notes-state.json
          key: patch-notes-state-${{ github.run_id }}
          restore-keys: patch-notes-state-

      - if: env.READY == 'true'
        run: npm run patch-notes
        env:
          # repos.json의 "webhook" 이름마다 한 줄. 저장소를 추가하면 여기도 추가한다.
          PATCH_NOTES_WEBHOOK_SHIRO: ${{ secrets.PATCH_NOTES_WEBHOOK_SHIRO }}
          PATCH_NOTES_WEBHOOK_SAFEHOUSE: ${{ secrets.PATCH_NOTES_WEBHOOK_SAFEHOUSE }}
          GOOGLE_CLOUD_PROJECT: aistudio-510104
          PATCH_NOTES_GH_TOKEN: ${{ secrets.PATCH_NOTES_GH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      # 한 저장소가 실패해도, 이미 올린 저장소의 진행 상황은 저장해야 같은 노트가 두 번 안 올라간다.
      - uses: actions/cache/save@v4
        if: always() && env.READY == 'true' && hashFiles('data/patch-notes-state.json') != ''
        with:
          path: data/patch-notes-state.json
          key: patch-notes-state-${{ github.run_id }}
